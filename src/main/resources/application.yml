spring:
  application:
    name: library-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/library_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update          # use 'validate' in production after migrations
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

# SpringDoc / Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: "Engineering Library Management API"
    version: "1.0.0"
    description: "REST API for managing books, members, and borrowing operations"

# Application-level constants
library:
  borrow:
    max-books-per-member: 5
    loan-duration-days: 14

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    com.engineering.library: DEBUG
    org.hibernate.SQL: WARN
